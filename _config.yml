title: "Sourav Khandai | Data Engineering Portfolio"
description: "Enterprise data engineering, architecture, reliability, distributed systems, operations research, industrial intelligence, and governed AI."
url: "https://SouravKh-7.github.io"
baseurl: "/git_portfolio"

theme: minima

header_pages:
  - projects.md
  - references.md
  - ecosystem.md
  - roadmap.md
  - about.md

plugins:
  - jekyll-feed

collections:
  projects:
    output: true
    permalink: /projects/:name.html

portfolio:
  primary_identity: "Data Engineer"
  positioning: "Reliable data platforms, AI-ready systems, and applied operational intelligence"

exclude:
  - ai-data-reliability-platform
  - local_ignored
  - reliabilityos
  - docs
  - portfolio_manifest.yaml
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
