title: "Sourav Khandai | Data Engineering, Platforms & Industrial AI"
description: "Architecture-led data engineering, reliable platforms, lakehouse systems, industrial data products, and governed AI assistance."
url: "https://SouravKh-7.github.io"
baseurl: "/git_portfolio"

theme: minima

header_pages:
  - projects.md
  - references.md
  - ecosystem.md
  - roadmap.md
  - about.md

plugins:
  - jekyll-feed

collections:
  projects:
    output: true
    permalink: /projects/:name.html

portfolio:
  primary_identity: "Data Engineer"
  positioning: "Data engineering, data platforms, data architecture, and evidence-grounded Industrial AI"

exclude:
  - ai-data-reliability-platform
  - local_ignored
  - reliabilityos
  - docs
  - portfolio_manifest.yaml
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
